name: Refresh xmldom lockfile

on:
  push:
    branches:
      - fix/xmldom-cve-2026-83616

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: ${{ !contains(github.event.head_commit.message, 'chore: refresh lockfile for xmldom fix') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: FrontEnd/package-lock.json

      - name: Regenerate lockfile
        working-directory: FrontEnd
        run: npm install --package-lock-only

      - name: Verify patched xmldom version
        working-directory: FrontEnd
        run: |
          node -e "const l=require('./package-lock.json'); const p=l.packages['node_modules/@xmldom/xmldom']; if (!p || p.version !== '0.8.15') { console.error('Expected @xmldom/xmldom 0.8.15, got', p && p.version); process.exit(1); } console.log('@xmldom/xmldom', p.version);"

      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FrontEnd/package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes required"
          else
            git commit -m "chore: refresh lockfile for xmldom fix"
            git push
          fi
